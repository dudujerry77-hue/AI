name: CI

# Runs the repository-defined quality gates from testing_strategy.md §6
# and deployment_strategy.md §2 (Release Pipeline):
# "1. Commit/PR opened -> CI triggers automatically.
#  2. Static checks: lint, format check, type check (if applicable).
#  3. Unit tests: must pass at 100% (no skipped/ignored tests without
#     explicit, reviewed justification).
#  4. Integration tests: must pass.
#  5. Security scan: dependency vulnerability scan per security_policy.md;
#     secrets-scanning of the diff."
#
# Item 5's "coverage thresholds" (testing_strategy.md §2/§6) are
# intentionally NOT enforced as a hard gate here: testing_strategy.md §2
# defines coverage targets by folder name (/domain, /application) that
# no engine package actually uses (see Phase 014 Milestone 1's
# documented ambiguity), so no single numeric threshold can be enforced
# without inventing an undocumented mapping. This workflow generates the
# coverage report (satisfying "generated") without gating on an
# invented number.
#
# deployment_strategy.md §2 step 5's "secrets-scanning of the diff" is
# implemented below as a basic, dependency-free pattern scan (fixed
# credential formats: AWS access key IDs, PEM private-key headers,
# GitHub tokens, Slack tokens) — the same no-new-dependency technique
# used for the "no skipped tests" step above, not a general-purpose
# secrets-scanning tool (gitleaks/trufflehog/etc.), which would be a
# new core dependency requiring tech_stack.md §2's mandatory
# stack-selection process (evaluation + ADR + tech_stack.md update),
# out of scope for a CI-workflow-only change. This scans the whole
# tracked tree on every run rather than only the diff, since true
# diff-scoped scanning would need to resolve a base ref — a reasonable,
# more conservative simplification using the same tooling.
#
# The second job below implements deployment_strategy.md §2 step 6's
# "produce the deployable artifact" and, for a local/CLI deployment
# target (ADR-0008: no hosting provider, no server — the artifact is
# invoked in-process), §2 steps 7-8's "deploy to staging" / "staging
# validation". Per ADR-0008, "production" for this target is the
# stable, packaged artifact run via local/CLI execution, so "staging"
# is a clean, freshly-provisioned local/CI environment running that
# same artifact — not a network-hosted environment requiring
# provider-specific configuration.
#
# The artifact is a `git archive` source tarball — the "package" form
# named in §2 step 6, not a container image, which would presume a
# hosting target not yet selected. This job runs only on push to `main`
# (i.e. on merge, per §2 step 7 — not on every PR), extracts the
# artifact into a fresh runner (a genuinely clean environment, not a
# reused checkout), reinstalls and rebuilds from scratch, and runs the
# complete existing test suite — including tests/integration/*.test.ts
# — unmodified, as the closest available stand-in for §2 step 8's
# "smoke tests / critical-path E2E tests" (Titan Core currently has no
# CLI entrypoint or HTTP surface to smoke-test directly — see ADR-0008's
# audit). The result is recorded as staging validation evidence in the
# job summary (commit SHA, artifact name, run link, test-suite result),
# satisfying phase-015's Exit Criteria wording "with documented
# evidence".
#
# The job declares `environment: staging`, giving it real, GitHub-native
# environment identity and automatic deployment history/records
# (visible under the repo's Environments tab and Deployments feed) —
# this is not cosmetic. It does NOT, by itself, provide
# deployment_strategy.md §1's "restricted access": GitHub Actions
# enforces restriction via environment protection rules (required
# reviewers, deployment branch policies), which must be configured in
# repository Settings -> Environments, not in this workflow file. Until
# those protection rules are configured manually, this environment has
# identity and a history of records but no actual access restriction —
# this is a tracked, outstanding manual step, not part of this file.
#
# The third job (`deploy-production`, Phase 016) implements
# deployment_strategy.md §2 steps 9-11 for the same local/CLI target:
# "manual promotion to production" (step 9), "production deploy... using
# the same artifact validated in staging" (step 10), and "post-deploy
# verification" (step 11). It runs ONLY on `workflow_dispatch` — a
# human must explicitly select a ref and click "Run workflow" in the
# GitHub UI (or use their own authenticated `gh`/API access); it can
# never run automatically on a push or PR, satisfying step 9's "never
# fully automatic" requirement by construction, not by an external
# protection rule this file can't guarantee is configured. On dispatch,
# the full pipeline runs in one continuous execution — quality-gates,
# then staging validation, then production — and `deploy-production`
# reuses the *exact* artifact `validate-artifact` already built and
# validated in the same run via `actions/upload-artifact` /
# `download-artifact`, rather than rebuilding it, honoring step 6's
# "build exactly once... promote that same artifact through later
# stages." Steps 10 and 11 are combined into one job: per ADR-0008,
# there is no running, network-facing service to separately monitor
# post-deploy (no `/interfaces` layer exists), so "deploy" and "verify
# it's healthy" collapse to the same act for this target — reinstalling
# and re-running the full test suite against the promoted artifact one
# final time, immediately before recording it as released. The job
# declares `environment: production` (auto-created on first dispatch,
# same as `staging` was); adding required-reviewer protection to it in
# repository Settings is a recommended, optional defense-in-depth
# hardening step, not required for the "never automatic" property,
# which `workflow_dispatch` alone already guarantees.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  quality-gates:
    name: Lint, test, build, coverage, dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check (deployment_strategy.md §2 step 2)
        run: npm run format:check

      - name: No skipped or ignored tests (deployment_strategy.md §2 step 3)
        run: '! grep -rnE "\b(it|describe|test)\.(skip|only|todo)\(" tests --include=*.ts'

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Coverage report
        run: npm run coverage

      - name: Dependency vulnerability scan (security_policy.md §5)
        run: npm audit --audit-level=high

      - name: Basic secrets pattern scan (deployment_strategy.md §2 step 5)
        run: '! grep -rnEI "(AKIA[0-9A-Z]{16}|-----BEGIN[A-Z ]*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9-]+)" --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=coverage --exclude-dir=.git .'

  validate-artifact:
    name: 'Staging: package artifact and validate in a clean environment'
    needs: quality-gates
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package artifact (deployment_strategy.md §2 step 6)
        run: npm run package

      - name: Upload artifact for promotion to production (deployment_strategy.md §2 step 6)
        uses: actions/upload-artifact@v4
        with:
          name: titan-core-artifact
          path: titan-core-artifact.tar.gz
          retention-days: 7

      - name: Extract artifact into a clean directory
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-validation"
          tar -xzf titan-core-artifact.tar.gz -C "$RUNNER_TEMP/artifact-validation"

      - name: Reinstall from the extracted artifact
        working-directory: ${{ runner.temp }}/artifact-validation
        run: npm ci

      - name: Build the extracted artifact
        working-directory: ${{ runner.temp }}/artifact-validation
        run: npm run build

      - name: Run the existing full test suite against the extracted artifact
        working-directory: ${{ runner.temp }}/artifact-validation
        run: npm test 2>&1 | tee "$RUNNER_TEMP/staging-test-output.log"

      - name: Record staging validation evidence (deployment_strategy.md §2 step 8; phase-015 Exit Criteria)
        run: |
          {
            echo "## Staging Validation Evidence"
            echo ""
            echo "- **Environment:** staging (clean, freshly-provisioned local/CI environment running the packaged artifact, per ADR-0008)"
            echo "- **Artifact:** titan-core-artifact.tar.gz"
            echo "- **Source commit:** ${{ github.sha }}"
            echo "- **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- **Validated (UTC):** $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo ""
            echo "### Test suite result"
            echo '```'
            grep -E "Test Files|^ *Tests " "$RUNNER_TEMP/staging-test-output.log" || echo "(summary lines not found in log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: 'Production: deploy and verify the validated artifact'
    needs: validate-artifact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download the artifact already validated in staging (deployment_strategy.md §2 step 6 / step 10)
        uses: actions/download-artifact@v4
        with:
          name: titan-core-artifact

      - name: Extract artifact into a clean directory
        run: |
          mkdir -p "$RUNNER_TEMP/production-deploy"
          tar -xzf titan-core-artifact.tar.gz -C "$RUNNER_TEMP/production-deploy"

      - name: Reinstall from the extracted artifact
        working-directory: ${{ runner.temp }}/production-deploy
        run: npm ci

      - name: Build the extracted artifact
        working-directory: ${{ runner.temp }}/production-deploy
        run: npm run build

      - name: Run the existing full test suite against the extracted artifact (deployment_strategy.md §2 step 11)
        working-directory: ${{ runner.temp }}/production-deploy
        run: npm test 2>&1 | tee "$RUNNER_TEMP/production-test-output.log"

      - name: Record production release evidence (deployment_strategy.md §2 steps 10-11; §4 traceability)
        run: |
          {
            echo "## Production Release Evidence"
            echo ""
            echo "- **Environment:** production (local/CLI execution of the packaged artifact, per ADR-0008)"
            echo "- **Artifact:** titan-core-artifact.tar.gz (built once by the staging job in this same run, not rebuilt)"
            echo "- **Source commit:** ${{ github.sha }}"
            echo "- **Triggered by:** ${{ github.actor }} (manual workflow_dispatch)"
            echo "- **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- **Deployed (UTC):** $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo ""
            echo "### Post-deploy verification result"
            echo '```'
            grep -E "Test Files|^ *Tests " "$RUNNER_TEMP/production-test-output.log" || echo "(summary lines not found in log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
